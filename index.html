<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Wedding</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Great+Vibes&family=Poiret+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="welcome__body">
    <main class="welcome">
      <div class="welcome__container">
        <div class="welcome__card">
          <img
            class="welcome__photo"
            src="./resources/images/aa-logo-white.png"
            alt="Wedding Logo"
          />
          <form>
            <label for="first-name"></label>
            <input type="text" id="name" placeholder="Enter First Name" />
            <input id="openInvitation" type="button" value="Open Invitation" />
          </form>
        </div>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
